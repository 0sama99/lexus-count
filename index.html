<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lexus Count · جرد لكزس</title>
<meta name="theme-color" content="#25282a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Al-Moussa identity: charcoal Pantone 426 C, silvers 420/422/424 C, champagne 7536 C, red 485 C as a thin accent */
:root{
  --bg:#e9eae9;--surface:#ffffff;--surface-2:#dcdddc;--fg:#25282a;--muted:#5f6263;--line:#c7c9c7;
  --go:#25282a;--go-fg:#ffffff;--danger:#b3261e;--danger-bg:#fbe8e5;--ok:#2e6b4a;--ok-bg:#e2efe7;--warn:#8a4b00;--warn-bg:#fdf0dc;
  --brand:#25282a;--brand-fg:#ecedec;--red:#da291c;--gold:#a69f88;
  --shop-bg:#e2edfb;--shop-fg:#0c3f78;--shop-line:#3a7bd5;
  --wh-bg:#fcecd9;--wh-fg:#6b3604;--wh-line:#c46a12;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1a1c1e;--surface:#25282a;--surface-2:#313437;--fg:#ecedec;--muted:#9ea2a2;--line:#3e4245;
  --go:#d6d8d6;--go-fg:#25282a;--danger:#ff8a80;--danger-bg:#3d1a17;--ok:#8fd1ad;--ok-bg:#1c3328;--warn:#fbc98a;--warn-bg:#3a2a12;
  --brand:#111314;--brand-fg:#ecedec;--red:#e2463a;--gold:#b7b09c;
  --shop-bg:#132d4d;--shop-fg:#bcd7fb;--shop-line:#6aa3ef;
  --wh-bg:#3f2608;--wh-fg:#fbd29d;--wh-line:#e69a45;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:16px;line-height:1.45;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(32px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--shop-line);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.wrap.wide{max-width:880px}
.mono{font-family:var(--font-mono);letter-spacing:.01em}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:14px;font-weight:500}
.progress{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:13px;color:var(--muted);margin:0 0 2px}
.part{font-size:26px;font-weight:600;margin:0;word-break:break-all}
.sys{font-size:28px;font-weight:600;margin:0;font-variant-numeric:tabular-nums}
.qty{width:100%;height:60px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:30px;font-weight:600;padding:0 16px;font-variant-numeric:tabular-nums}
.qty:focus{border-color:var(--go);outline:none}
.locs{display:flex;flex-direction:column;gap:8px}
.loc{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:54px;border-radius:12px;padding:8px 14px;font-size:20px;font-weight:600;border:1.5px solid;text-align:start}
.loc .tag{font-size:13px;font-weight:500;font-family:var(--font-ui)}
.loc.S,.pill.S{background:var(--shop-bg);color:var(--shop-fg);border-color:var(--shop-line)}
.loc.W,.pill.W{background:var(--wh-bg);color:var(--wh-fg);border-color:var(--wh-line)}
.loc.sel{border-width:4px;padding:6px 12px}
.other{background:none;border:none;color:var(--muted);font-size:15px;text-decoration:underline;padding:6px;align-self:center}
.otherin{height:52px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:20px;padding:0 14px;text-transform:uppercase;width:100%}
.big{height:56px;border-radius:12px;border:none;font-size:19px;font-weight:600;width:100%}
.go{background:var(--go);color:var(--go-fg)}
.ghost{background:var(--surface);border:1.5px solid var(--line)}
.err{color:var(--danger);font-size:14px;margin:0;font-weight:500}
.warnbox{background:var(--danger-bg);color:var(--danger);border-radius:12px;padding:12px 14px;font-weight:600;font-size:17px}
.recount{align-self:flex-start;background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:3px 10px;font-size:14px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;border:1px solid;border-radius:8px;padding:1px 8px;font-size:13px;font-weight:500}
.sync{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.sync.ok{background:var(--ok-bg);color:var(--ok)}
.sync.pend{background:var(--warn-bg);color:var(--warn)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border:none;border-bottom:1px solid var(--line);width:100%;background:none;text-align:start}
.row:last-child{border-bottom:none}
.row .meta{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.done-hero{text-align:center;padding:36px 16px}
.done-hero p{margin:6px 0}
.notice{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field input{height:50px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font-size:17px;padding:0 14px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.who button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:15px;white-space:nowrap}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.meter{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--go);border-radius:99px}
.rv{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:none}
.rv .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sm{min-height:40px;border-radius:10px;padding:0 14px;font-size:15px;font-weight:600;border:1.5px solid var(--line);background:var(--surface)}
.sm.go{background:var(--go);color:var(--go-fg);border-color:var(--go)}
.sm.red{color:var(--danger);border-color:var(--danger)}
.diff{color:var(--danger);font-weight:600}
.same{color:var(--ok);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.tblwrap{overflow-x:auto}
.note{font-size:14px;color:var(--muted);margin:0}
.toast{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
.toast span{background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 16px;font-size:15px;max-width:90vw}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:0}
.sig{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.brandband{background:var(--brand);color:var(--brand-fg);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--red)}
.brandband img{height:58px;width:auto;flex:none}
.brandband h1{color:var(--brand-fg)}
.brandband .sub{color:#b9bcbc}
.brandband .chipbtn{background:transparent;color:var(--brand-fg);border-color:#5a5e61;margin-inline-start:auto}
[dir="rtl"] .other{font-family:var(--font-ui)}
@media (prefers-reduced-motion:no-preference){.big:active,.loc:active{transform:scale(.985)}}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="sub">Loading…</p></div></div>
<div class="toast" id="toast" hidden><span id="toastText"></span></div>
<script src="config.js"></script>
<script type="module">
/* ================= setup ================= */
const FBV = "10.12.2";
const FB = n => `https://www.gstatic.com/firebasejs/${FBV}/firebase-${n}.js`;
const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
const CFG = window.APP_CONFIG || {};
const DEMO = !CFG.firebase || String(CFG.firebase.apiKey || "").startsWith("PASTE");
const ROLES = {
  shop: { place: "S", ar: "موظف المحل", en: "Shop" },
  w1:   { place: "W", ar: "موظف المستودع ١", en: "Warehouse 1" },
  w2:   { place: "W", ar: "موظف المستودع ٢", en: "Warehouse 2" }
};
const EMP_ROLES = Object.keys(ROLES);

if ("serviceWorker" in navigator && !DEMO) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ================= state ================= */
const S = {
  phase: "boot",            // boot | login | norole | app
  email: null, role: null, name: "",
  parts: new Map(),         // id -> part
  entries: new Map(),       // id (PART_S / PART_W) -> entry
  pending: new Set(),       // entry ids not yet sent to the server
  presence: new Map(), roles: new Map(), log: [],
  settings: { days: 6 },
  partsLoaded: false,
  online: navigator.onLine,
  loginErr: "", loginBusy: false
};
const UI = { view: "count", editKey: null, from: "count", draft: null, tab: "dash", page: 1, rcOpen: null,
  confirmBulk: false, inclOld: false, importPreview: null, importBusy: false, confirmSignOut: false,
  who: "", fastOnly: false, rcOnly: false, q: "", qDraft: "" };  // manager filters + part-number search (review / approved / exported); kept when switching tabs
addEventListener("online", () => { S.online = true; store.touch && store.touch(); render(); });
addEventListener("offline", () => { S.online = false; render(); });

/* ================= helpers ================= */
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const N = n => Number(n).toLocaleString("en-US");
const p2 = n => String(n).padStart(2, "0");
function fmtTs(ms) { if (!ms) return ""; const d = new Date(ms), h = d.getHours(); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)} ${h % 12 || 12}:${p2(d.getMinutes())} ${h < 12 ? "ص" : "م"}`; }
function fmtTsFull(ms) { if (!ms) return ""; const d = new Date(ms); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)}/${d.getFullYear()} ${fmtTs(ms).split(" ").slice(1).join(" ")}`; }
function fmtEn(ms) { if (!ms) return ""; const d = new Date(ms), h = d.getHours(); return `${p2(d.getDate())}/${p2(d.getMonth() + 1)} ${h % 12 || 12}:${p2(d.getMinutes())} ${h < 12 ? "AM" : "PM"}`; }
const sameDay = (ms) => ms && new Date(ms).toDateString() === new Date().toDateString();
function toast(msg) { const el = document.getElementById("toast"); document.getElementById("toastText").textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2600); }
function loadScript(src) { return new Promise((res, rej) => { if (window.XLSX) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

const activeParts = () => [...S.parts.values()].filter(p => !p.gone);
function partKeys(p) { const k = []; if (p.shop) k.push(p.id + "_S"); if (p.wh) k.push(p.id + "_W"); return k; }
const counted = e => e && e.status === "counted";
function locsOf(p) { return (p.s || []).map(l => ({ l, t: "S" })).concat((p.w || []).map(l => ({ l, t: "W" }))); }
const twoPlaces = p => partKeys(p).length > 1;
function partStatus(p) {
  if (p.approved) return "approved";
  const ks = partKeys(p), n = ks.filter(k => counted(S.entries.get(k))).length;
  if (n === 0) return "remaining";
  return n < ks.length ? "waiting" : "review";
}
const partTotal = p => partKeys(p).reduce((a, k) => a + (counted(S.entries.get(k)) ? S.entries.get(k).q : 0), 0);

/* ================= data layer ================= */
function reopenUpdate(p, places) {
  const upd = { approved: null, hold: !places.length, expS: false, expW: false };
  if (p.expS) upd.prevS = { q: p.expSQ ?? null, loc: p.expSLoc ?? "", at: p.expSAt || null };
  if (p.expW) upd.prevW = { loc: p.expWLoc ?? "", at: p.expWAt || null };
  return upd;
}
// The count a recount replaces (the employee's new count overwrites the entry), kept on the part so the manager still sees it.
function rcSnaps(id, places) {
  const out = [];
  for (const pl of places) {
    const e = S.entries.get(id + "_" + pl);
    if (counted(e)) out.push({ place: pl, q: e.q, loc: e.loc || "", lt: e.lt || pl, role: e.role || "", by: e.by || "", at: e.countedAt || null, rcAt: Date.now() });
  }
  return out;
}
let store;

/* ----- demo (no Firebase): fake parts, nothing leaves the browser ----- */
function makeDemo() {
  const parts = [];
  const shopL = ["CA-12", "CB-30", "CF-48", "CJ-15", "CN-82"], whL = ["BBR-48", "BCL-113", "TR1-60", "FE-25", "W-79"];
  for (let i = 0; i < 36; i++) {
    const id = `X9${p2(i)}00-DEMO${i % 10}`;
    const kind = i % 6; // 0: shop only, 1-3: both, 4: warehouse only, 5: none on some
    const s = kind === 0 || kind <= 3 && kind > 0 ? [shopL[i % 5]] : [];
    const w = kind >= 1 && kind <= 4 ? [whL[i % 5]].concat(i % 7 === 0 ? [whL[(i + 2) % 5]] : []) : [];
    const none = kind === 5;
    const qx = (i * 3) % 7, qp = i % 4 === 0 ? -1 : (i % 9 === 0 ? 2 : 0);
    parts.push({ id, n: id, p: id.slice(1), q: qx + qp, qx, qp, s: none ? [] : s, w: none ? [] : w });
  }
  return { parts };
}
function buildParts(d) {
  // d = app_data.json: {parts:[[x, plain, total, shopLocs, whLocs, qx, qp]], shop:[idx], w1:[idx], w2:[idx]}
  const list = d.parts.map(r => ({ id: r[0], n: r[0], p: r[1], q: r[2], s: r[3] || [], w: r[4] || [], qx: r[5] ?? r[2], qp: r[6] ?? 0, shop: false, wh: null, os: null, ow: null }));
  d.shop.forEach((i, k) => { list[i].shop = true; list[i].os = k; });
  d.w1.forEach((i, k) => { list[i].wh = "w1"; list[i].ow = k; });
  d.w2.forEach((i, k) => { list[i].wh = "w2"; list[i].ow = k; });
  return list;
}
function validateData(d) {
  if (!d || !Array.isArray(d.parts) || !Array.isArray(d.shop) || !Array.isArray(d.w1) || !Array.isArray(d.w2)) return "الملف مو بالشكل المتوقع (app_data.json).";
  for (const r of d.parts) {
    if (!Array.isArray(r) || typeof r[0] !== "string" || !r[0] || r[0].includes("/") || !Number.isInteger(r[2])) return "فيه سطر غلط في الملف: " + JSON.stringify(r).slice(0, 80);
  }
  const n = d.parts.length;
  for (const k of ["shop", "w1", "w2"]) if (d[k].some(i => !Number.isInteger(i) || i < 0 || i >= n)) return "قائمة " + k + " فيها رقم غلط.";
  return "";
}
function demoAssign(raw) {
  const parts = raw.parts.map(p => Object.assign({}, p));
  const none = parts.filter(p => !p.s.length && !p.w.length);
  const shop = parts.filter(p => p.s.length), wh = parts.filter(p => p.w.length);
  const d = { parts: parts.map(p => [p.id, p.p, p.q, p.s, p.w, p.qx, p.qp]), shop: [], w1: [], w2: [] };
  const idx = p => parts.indexOf(p);
  d.shop = shop.map(idx).concat(none.map(idx));
  const half = Math.ceil((wh.length + none.length) / 2) - Math.ceil(none.length / 2);
  d.w1 = wh.slice(0, half).map(idx); d.w2 = wh.slice(half).map(idx);
  none.forEach((p, k) => (k % 2 ? d.w2 : d.w1).push(idx(p)));
  return d;
}
function demoStore() {
  const put = list => { S.parts.clear(); for (const p of list) S.parts.set(p.id, Object.assign({ approved: null, expS: false, expW: false, gone: false }, p)); };
  put(buildParts(demoAssign(makeDemo())));
  S.partsLoaded = true;
  S.roles = new Map([["osama@demo", { role: "admin", name: "Osama" }], ["zakir@demo", { role: "shop", name: "Zakir" }], ["rasel@demo", { role: "w1", name: "Rasel" }], ["saiful@demo", { role: "w2", name: "Saiful" }]]);
  const log = (action, detail) => S.log.unshift({ at: Date.now(), by: S.email, action, detail });
  return {
    demo: true,
    start() { S.phase = "login"; render(); },
    signInAs(email) { const r = S.roles.get(email); S.email = email; S.role = r.role; S.name = r.name; S.phase = "app"; S.presence.set(email, { lastSeen: Date.now(), role: r.role }); resetUI(); render(); },
    signOut() { S.email = null; S.role = null; S.phase = "login"; render(); },
    touch() {},
    saveEntry(e) { S.entries.set(e.part + "_" + e.place, Object.assign({}, e, { by: S.email, role: S.role, countedAt: Date.now(), sentAt: Date.now(), status: "counted" })); S.presence.set(S.email, { lastSeen: Date.now(), role: S.role }); render(); },
    async approve(ids, auto) { ids.forEach(id => S.parts.get(id).approved = { at: Date.now(), by: S.email, auto: !!auto }); if (!auto) log("approve", ids.length + " قطعة"); render(); },
    async unapprove(id) { Object.assign(S.parts.get(id), { approved: null, hold: true }); log("unapprove", id); render(); },
    async recount(id, places) { const p = S.parts.get(id), snaps = rcSnaps(id, places); for (const pl of places) { const e = S.entries.get(id + "_" + pl); if (e) e.status = "recount"; } Object.assign(p, { approved: null, hold: false }, snaps.length ? { rcHist: (p.rcHist || []).concat(snaps) } : {}); log("recount", id + " " + places.join("+")); render(); },
    async markExported(snaps, kind) { snaps.forEach(s => Object.assign(S.parts.get(s.id), kind === "S" ? { expS: true, expSAt: Date.now(), expSQ: s.q, expSLoc: s.loc || "" } : { expW: true, expWAt: Date.now(), expWLoc: s.loc || "" })); log("export", kind + " " + snaps.length); render(); },
    async reopenExported(id, places) { const p = S.parts.get(id), upd = reopenUpdate(p, places), snaps = rcSnaps(id, places); if (snaps.length) upd.rcHist = (p.rcHist || []).concat(snaps); for (const pl of places) { const e = S.entries.get(id + "_" + pl); if (e) e.status = "recount"; } Object.assign(p, upd); log(places.length ? "recount" : "unapprove", id + " بعد التصدير"); render(); },
    async importData(d) { const keep = new Map(S.parts); put(buildParts(d).map(p => Object.assign({}, keep.get(p.id) ? { approved: keep.get(p.id).approved, expS: keep.get(p.id).expS, expW: keep.get(p.id).expW } : {}, p))); for (const id of keep.keys()) if (!S.parts.has(id)) S.parts.set(id, Object.assign(keep.get(id), { gone: true })); log("import", d.parts.length + " قطعة"); render(); },
    async setDays(n) { S.settings.days = n; render(); }
  };
}

/* ----- Firebase ----- */
async function firebaseStore() {
  const [A, AU, F] = await Promise.all([import(FB("app")), import(FB("auth")), import(FB("firestore"))]);
  const fbApp = A.initializeApp(CFG.firebase);
  const auth = AU.getAuth(fbApp);
  let db;
  try { db = F.initializeFirestore(fbApp, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch (e) { db = F.getFirestore(fbApp); }
  let unsubs = [];
  const stopAll = () => { unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; };
  const tsMs = v => v && typeof v.toMillis === "function" ? v.toMillis() : (typeof v === "number" ? v : null);
  const dataOf = d => d.data({ serverTimestamps: "estimate" });
  const log = (action, detail) => F.addDoc(F.collection(db, "log"), { at: F.serverTimestamp(), by: S.email, action, detail: String(detail).slice(0, 200) }).catch(() => {});

  function startData() {
    stopAll();
    unsubs.push(F.onSnapshot(F.doc(db, "roles", S.email), snap => {
      if (snap.exists()) {
        const r = snap.data(); const changed = r.role !== S.role;
        S.role = r.role; S.name = r.name || ""; S.phase = "app";
        if (changed) { resetUI(); startRoleData(); store && store.touch(); }
        render();
      } else if (!snap.metadata.fromCache) { S.phase = "norole"; render(); }
    }, () => { S.phase = "norole"; render(); }));
  }
  let roleUnsubs = [];
  function startRoleData() {
    roleUnsubs.forEach(u => u()); roleUnsubs = [];
    roleUnsubs.push(F.onSnapshot(F.doc(db, "settings", "main"), s => { if (s.exists()) S.settings = Object.assign({ days: 6 }, s.data()); render(); }, () => {}));
    roleUnsubs.push(F.onSnapshot(F.collection(db, "parts"), snap => {
      for (const ch of snap.docChanges()) {
        if (ch.type === "removed") S.parts.delete(ch.doc.id);
        else { const d = dataOf(ch.doc); S.parts.set(ch.doc.id, Object.assign({ id: ch.doc.id, s: [], w: [], approved: null, expS: false, expW: false, gone: false }, d, { approved: d.approved ? { at: tsMs(d.approved.at), by: d.approved.by, auto: !!d.approved.auto } : null,
          expSAt: tsMs(d.expSAt), expWAt: tsMs(d.expWAt),
          prevS: d.prevS ? Object.assign({}, d.prevS, { at: tsMs(d.prevS.at) }) : null,
          prevW: d.prevW ? Object.assign({}, d.prevW, { at: tsMs(d.prevW.at) }) : null })); }
      }
      S.partsLoaded = true; render();
    }, err => { console.error(err); toast("Could not load parts"); }));
    const eq = S.role === "admin" ? F.collection(db, "entries") : F.query(F.collection(db, "entries"), F.where("role", "==", S.role));
    roleUnsubs.push(F.onSnapshot(eq, { includeMetadataChanges: true }, snap => {
      for (const ch of snap.docChanges({ includeMetadataChanges: true })) {
        if (ch.type === "removed") { S.entries.delete(ch.doc.id); S.pending.delete(ch.doc.id); continue; }
        const d = dataOf(ch.doc);
        S.entries.set(ch.doc.id, Object.assign({}, d, { id: ch.doc.id, sentAt: tsMs(d.sentAt), countedAt: tsMs(d.countedAt) }));
        if (ch.doc.metadata.hasPendingWrites) S.pending.add(ch.doc.id); else S.pending.delete(ch.doc.id);
      }
      render();
    }, err => console.error(err)));
    if (S.role === "admin") {
      roleUnsubs.push(F.onSnapshot(F.collection(db, "roles"), snap => { S.roles = new Map(snap.docs.map(d => [d.id, d.data()])); render(); }, () => {}));
      roleUnsubs.push(F.onSnapshot(F.collection(db, "presence"), snap => { S.presence = new Map(snap.docs.map(d => { const x = dataOf(d); return [d.id, { role: x.role, lastSeen: tsMs(x.lastSeen) }]; })); render(); }, () => {}));
      roleUnsubs.push(F.onSnapshot(F.query(F.collection(db, "log"), F.orderBy("at", "desc"), F.limit(60)), snap => { S.log = snap.docs.map(d => { const x = dataOf(d); return Object.assign({}, x, { at: tsMs(x.at) }); }); render(); }, () => {}));
    }
    unsubs.push(() => { roleUnsubs.forEach(u => u()); roleUnsubs = []; });
  }

  AU.onAuthStateChanged(auth, user => {
    if (!user) { stopAll(); Object.assign(S, { email: null, role: null, phase: "login" }); S.entries.clear(); S.parts.clear(); S.pending.clear(); S.partsLoaded = false; render(); return; }
    S.email = (user.email || "").toLowerCase(); S.phase = "boot"; render();
    startData();
  });

  const batches = async (ops) => { for (let i = 0; i < ops.length; i += 400) { const b = F.writeBatch(db); ops.slice(i, i + 400).forEach(fn => fn(b)); await b.commit(); } };

  return {
    demo: false,
    start() {},
    async signIn(email, pw) { await AU.signInWithEmailAndPassword(auth, email.trim(), pw); },
    async signOut() { await AU.signOut(auth); },
    touch() { if (S.email && S.role) F.setDoc(F.doc(db, "presence", S.email), { role: S.role, lastSeen: F.serverTimestamp() }, { merge: true }).catch(() => {}); },
    saveEntry(e) {
      // Not awaited on purpose: offline, the write is kept on the phone and sent later.
      F.setDoc(F.doc(db, "entries", e.part + "_" + e.place), {
        part: e.part, place: e.place, q: e.q, loc: e.loc, lt: e.lt,
        by: S.email, role: S.role, countedAt: Date.now(), sentAt: F.serverTimestamp(), status: "counted"
      }).catch(err => { console.error(err); toast("Not saved. Tell the manager."); });
      this.touch();
    },
    async approve(ids, auto) { await batches(ids.map(id => b => b.update(F.doc(db, "parts", id), { approved: { at: F.serverTimestamp(), by: S.email, auto: !!auto } }))); if (!auto) log("approve", ids.length + " قطعة"); },
    async unapprove(id) { await F.updateDoc(F.doc(db, "parts", id), { approved: null, hold: true }); log("unapprove", id); },
    async recount(id, places) {
      const snaps = rcSnaps(id, places), upd = { approved: null, hold: false };
      if (snaps.length) upd.rcHist = F.arrayUnion(...snaps);
      const ops = places.map(pl => b => b.set(F.doc(db, "entries", id + "_" + pl), { status: "recount", recountAt: F.serverTimestamp() }, { merge: true }));
      ops.push(b => b.update(F.doc(db, "parts", id), upd));
      await batches(ops); log("recount", id + " " + places.join("+"));
    },
    async markExported(snaps, kind) {
      // snaps: [{ id, q, loc }] = what went into the Excel file, kept so a later correction can show "before"
      await batches(snaps.map(s => b => b.update(F.doc(db, "parts", s.id), kind === "S"
        ? { expS: true, expSAt: F.serverTimestamp(), expSQ: s.q, expSLoc: s.loc || "" }
        : { expW: true, expWAt: F.serverTimestamp(), expWLoc: s.loc || "" })));
      log("export", (kind === "S" ? "المحل " : "المستودع ") + snaps.length);
    },
    async reopenExported(id, places) {
      // places = [] -> back to review only; ["S"] / ["W"] / ["S","W"] -> recount. Both export marks are cleared,
      // so the part goes into the next export of both lists, flagged as a correction.
      const p = S.parts.get(id), upd = reopenUpdate(p, places), snaps = rcSnaps(id, places);
      if (snaps.length) upd.rcHist = F.arrayUnion(...snaps);
      const ops = places.map(pl => b => b.set(F.doc(db, "entries", id + "_" + pl), { status: "recount", recountAt: F.serverTimestamp() }, { merge: true }));
      ops.push(b => b.update(F.doc(db, "parts", id), upd));
      await batches(ops);
      log(places.length ? "recount" : "unapprove", id + " بعد التصدير" + (places.length ? " " + places.join("+") : ""));
    },
    async importData(d) {
      const list = buildParts(d), ids = new Set(list.map(p => p.id));
      const ops = list.map(p => b => {
        const base = { n: p.n, p: p.p, q: p.q, qx: p.qx, qp: p.qp, s: p.s, w: p.w, shop: p.shop, wh: p.wh, os: p.os, ow: p.ow, gone: false, importedAt: F.serverTimestamp() };
        if (!S.parts.has(p.id)) Object.assign(base, { approved: null, expS: false, expW: false });
        b.set(F.doc(db, "parts", p.id), base, { merge: true });
      });
      for (const id of S.parts.keys()) if (!ids.has(id)) ops.push(b => b.update(F.doc(db, "parts", id), { gone: true }));
      await batches(ops);
      await F.setDoc(F.doc(db, "settings", "main"), { importedAt: F.serverTimestamp(), importedParts: list.length }, { merge: true });
      log("import", list.length + " قطعة");
    },
    async setDays(n) { await F.setDoc(F.doc(db, "settings", "main"), { days: n }, { merge: true }); }
  };
}

/* ================= manager ================= */
/* time between one employee's consecutive counts, and auto-approval of matching parts */
const FAST_SEC = 15;
let GAPS = new Map();
function computeGaps() {
  GAPS = new Map(); const byRole = {};
  for (const [id, e] of S.entries) if (counted(e) && e.countedAt) (byRole[e.role] = byRole[e.role] || []).push([id, e.countedAt]);
  for (const list of Object.values(byRole)) {
    list.sort((a, b) => a[1] - b[1]);
    for (let i = 1; i < list.length; i++) {
      const g = (list[i][1] - list[i - 1][1]) / 1000;
      if (g < 3600 && sameDayPair(list[i][1], list[i - 1][1])) GAPS.set(list[i][0], g);
    }
  }
}
const sameDayPair = (a, b) => new Date(a).toDateString() === new Date(b).toDateString();
function gapTxt(s) { s = Math.round(s); return s < 60 ? `${s} ث` : `${Math.floor(s / 60)} د ${s % 60} ث`; }
function gapBadge(id) { const g = GAPS.get(id); if (g == null) return ""; return `<span class="${g < FAST_SEC ? "diff" : "sub"}" title="الوقت من العدّة اللي قبلها لنفس الموظف">⏱ ${gapTxt(g)}</span>`; }
const isFast = p => partKeys(p).some(k => { const g = GAPS.get(k); return g != null && g < FAST_SEC; });
const autoBusy = new Set(); let autoTimer = null;
function scheduleAuto() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    const ids = activeParts().filter(p => !p.hold && !autoBusy.has(p.id) && partStatus(p) === "review" && partTotal(p) === p.q).map(p => p.id);
    if (!ids.length) return;
    ids.forEach(id => autoBusy.add(id));
    store.approve(ids, true).catch(e => console.error(e)).finally(() => ids.forEach(id => autoBusy.delete(id)));
  }, 400);
}
function counts() { const c = { remaining: 0, waiting: 0, review: 0, approved: 0 }; activeParts().forEach(p => c[partStatus(p)]++); return c; }
function empName(role) { for (const [em, r] of S.roles) if (r.role === role) return r.name || em; return ROLES[role] ? ROLES[role].ar : role; }
function empEmail(role) { for (const [em, r] of S.roles) if (r.role === role) return em; return null; }
function mgrShell(body) {

  const c = counts();
  const ae = document.activeElement, keepQ = ae && ae.id === "mq" ? [ae.selectionStart, ae.selectionEnd] : null;

const HEAD = { S: ["رقم القطعة", "الكمية المعدودة", "كمية النظام", "منها على X", "منها بدون X", "موقع المحل", "وقت عد المحل", "وقت عد المستودع", "تصحيح"], W: ["رقم القطعة", "الموقع", "تصحيح"], P: ["الرقم بدون X"] };
const FNAME = { S: "قائمة المحل", W: "قائمة المستودع", P: "أرقام المبرمج" };
function exportSet(kind, all) {
  const ap = activeParts().filter(p => p.approved).sort((a, b) => a.n.localeCompare(b.n));
  if (kind === "S") return ap.filter(p => all || !p.expS);
  if (kind === "W") return ap.filter(p => p.wh && (all || !p.expW));
  return ap;
}
function exportRows(kind, parts) {
  return parts.map(p => {
    const es = S.entries.get(p.id + "_S"), ew = S.entries.get(p.id + "_W");
    if (kind === "S") return [p.n, partTotal(p), p.q, p.qx, p.qp, counted(es) ? es.loc : "", counted(es) ? fmtTsFull(es.countedAt) : "", counted(ew) ? fmtTsFull(ew.countedAt) : "",
      p.prevS ? `قبل: ${p.prevS.q ?? "?"}${p.prevS.loc ? " · " + p.prevS.loc : ""}` : ""];
    if (kind === "W") return [p.n, counted(ew) ? ew.loc : "", p.prevW ? `قبل: ${p.prevW.loc || "-"}` : ""];
    return [p.p];
  });
}
function renderExport() {
  const card = (kind, title, desc) => {
    const parts = exportSet(kind, UI.inclOld || kind === "P"), rows = exportRows(kind, parts);
    return `<div class="card"><div class="bar"><h2>${title}</h2><span class="sub">${N(rows.length)} قطعة</span></div>
      <p class="note">${desc}</p>
      ${rows.length ? `<div class="tblwrap"><table class="tbl"><thead><tr>${HEAD[kind].map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.slice(0, 4).map(r => `<tr>${r.map(c => `<td class="mono" dir="ltr">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : ""}
      <button class="sm go" data-act="xlsx" data-k="${kind}">تصدير Excel</button></div>`;
  };
  mgrShell(`
    <label class="sub" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="inclOld" ${UI.inclOld ? "checked" : ""}> تشمل القطع اللي انصدرت قبل</label>
    ${card("S", "قائمة المحل", "كل القطع المعتمدة. تصفّر الرقم بدون X، وتحط الكمية المعدودة على X، وتثبت موقع المحل. ووقت العد عشان تراجع المبيعات اللي صارت بعده.")}
    ${card("W", "قائمة المستودع", "القطع المعتمدة اللي انعدت في المستودع: رقم القطعة والموقع اللي يتثبت في نظام المستودع.")}
    ${card("P", "أرقام المبرمج", "الأرقام بدون X للقطع المعتمدة، عشان يحذفها أو يوقفها بعد ما تخلص التسوية.")}`);
  const cb = document.getElementById("inclOld"); cb.addEventListener("change", () => { UI.inclOld = cb.checked; render(); });
}
async function doExport(kind) {
  const parts = exportSet(kind, UI.inclOld || kind === "P");
  if (!parts.length) return toast("ما فيه قطع معتمدة للتصدير");
  try { await loadScript(XLSX_URL); } catch (e) { return toast("ما قدرت أحمّل أداة Excel. تأكد من النت."); }
  const ws = XLSX.utils.aoa_to_sheet([HEAD[kind]].concat(exportRows(kind, parts)));
  ws["!cols"] = HEAD[kind].map(() => ({ wch: 18 }));
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
  const d = new Date();
  XLSX.writeFile(wb, `${FNAME[kind]} ${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}.xlsx`);
  if (kind !== "P") { try { await store.markExported(parts.map(p => { const e = S.entries.get(p.id + "_" + kind); return { id: p.id, q: partTotal(p), loc: counted(e) ? e.loc : "" }; }), kind); } catch (e) { toast("انحفظ الملف، بس ما تعلّمت القطع كمصدّرة"); return; } }
  toast("انحفظ الملف");
}
function renderData() {
  const pv = UI.importPreview;
  const staff = [...S.roles.entries()].map(([em, r]) => `<div class="row"><div><b>${esc(r.name || em)}</b><div class="meta" dir="ltr">${esc(em)}</div></div>
      <span class="${r.role === "admin" ? "sub" : "pill " + (ROLES[r.role]?.place || "")}">${r.role === "admin" ? "المدير" : esc(ROLES[r.role]?.ar || r.role)}</span></div>`).join("");
  const logRows = S.log.slice(0, 30).map(l => `<div class="row"><div><b>${esc({ approve: "اعتماد", unapprove: "إلغاء اعتماد", recount: "إعادة عد", export: "تصدير", import: "رفع بيانات" }[l.action] || l.action)}</b> <span class="sub">${esc(l.detail || "")}</span></div><span class="sub" dir="ltr">${fmtTs(l.at)}</span></div>`).join("");
  mgrShell(`
    <div class="card"><h2>رفع البيانات</h2>
      <p class="note">ارفع ملف app_data.json اللي يجهزه Claude من ملفات الإكسل. الرفع الثاني يحدّث الكميات والمواقع، وما يمسح العدّ ولا الاعتمادات.</p>
      <input type="file" id="dataFile" accept=".json,application/json">
      ${pv ? (pv.err ? `<p class="err">${esc(pv.err)}</p>` : `<div class="notice">الملف فيه <b>${N(pv.parts)}</b> قطعة: المحل ${N(pv.shop)} · المستودع ١ ${N(pv.w1)} · المستودع ٢ ${N(pv.w2)}.<br>جديدة ${N(pv.added)} · تتحدث ${N(pv.updated)}${pv.gone ? ` · <span class="diff">${N(pv.gone)} قطعة موجودة الحين ومو في الملف بتختفي من القوائم</span>` : ""}</div>
        <div class="acts"><button class="sm go" data-act="importYes" ${UI.importBusy ? "disabled" : ""}>${UI.importBusy ? "جاري الرفع…" : "رفع البيانات"}</button><button class="sm" data-act="importNo">إلغاء</button></div>`) : ""}
      <p class="sub">آخر رفع: ${S.settings.importedParts ? N(S.settings.importedParts) + " قطعة" : "ما فيه"}</p>
    </div>
    <div class="card"><h2>مدة الجرد</h2>
      <p class="note">هدف اليوم لكل موظف = عدد قطعه ÷ عدد الأيام.</p>
      <div class="acts"><label for="days">عدد الأيام</label><input id="days" type="number" min="1" max="60" value="${S.settings.days || 6}" style="width:90px;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--fg)">
      <button class="sm" data-act="saveDays">حفظ</button></div>
    </div>
    <div class="card" style="gap:0"><h2 style="margin-bottom:6px">الحسابات</h2>${staff || `<p class="note">ما فيه حسابات.</p>`}
      <p class="note" style="margin-top:8px">إضافة موظف أو إيقافه من Firebase: Authentication للحساب، و roles للدور (shop أو w1 أو w2).</p></div>
    <div class="card" style="gap:0"><h2 style="margin-bottom:6px">السجل</h2>${logRows || `<p class="note">ما فيه شي لين الحين.</p>`}</div>`);
  document.getElementById("dataFile").addEventListener("change", ev => {
    const f = ev.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let d; try { d = JSON.parse(rd.result); } catch (e) { UI.importPreview = { err: "الملف مو JSON صحيح." }; return render(); }
      const err = validateData(d); if (err) { UI.importPreview = { err }; return render(); }
      const ids = new Set(d.parts.map(r => r[0]));
      UI.importData = d;
      UI.importPreview = { parts: d.parts.length, shop: d.shop.length, w1: d.w1.length, w2: d.w2.length,
        added: d.parts.filter(r => !S.parts.has(r[0])).length, updated: d.parts.filter(r => S.parts.has(r[0])).length,
        gone: [...S.parts.keys()].filter(id => !ids.has(id) && !S.parts.get(id).gone).length };
      render();
    };
    rd.readAsText(f);
  });
}

/* ================= router + events ================= */
function render() {
  lastRender = Date.now();
  if (!store || S.phase === "boot") { app.innerHTML = `<div class="wrap"><p class="sub">Loading…</p></div>`; return; }
  if (S.phase === "login") return renderLogin();
  if (S.phase === "norole") return renderNoRole();
  if (S.role === "admin") { computeGaps(); if (S.partsLoaded) scheduleAuto(); }
  if (S.role === "admin") return ({ dash: renderDash, review: renderReview, approved: renderApproved, exported: renderExported, export: renderExport, data: renderData })[UI.tab]();
  if (!ROLES[S.role]) return renderNoRole();
  if (UI.view === "summary" && UI.draft) return renderSummary();
  if (UI.view === "mine") return renderMine();
  return renderCount();
}
let lastRender = 0;
const GUARDED = new Set(["approve", "bulkAsk", "bulkYes", "unapprove", "rc", "rcOpen", "confirm", "done", "xAsk", "xYes"]);
app.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (GUARDED.has(a) && Date.now() - lastRender < 500) return; // ignore a second tap landing on a freshly drawn button
  const id = b.dataset.id;
  try {
    switch (a) {
      case "demoAs": return store.signInAs(b.dataset.e);
      case "signOutNow": UI.confirmSignOut = false; resetUI(); return store.signOut();
      case "signOutAsk": UI.confirmSignOut = true; return render();
      case "signOutNo": UI.confirmSignOut = false; return render();
      case "mine": UI.view = "mine"; return render();
      case "back": UI.view = "count"; UI.editKey = null; UI.draft = null; return render();
      case "cancelEdit": UI.editKey = null; UI.draft = null; UI.view = UI.from === "mine" ? "mine" : "count"; return render();
      case "openEntry": UI.editKey = b.dataset.k; UI.from = "mine"; UI.draft = null; UI.view = "count"; return render();
      case "pick": { const p = S.parts.get(UI.draft.key.slice(0, -2)), x = locsOf(p)[+b.dataset.j]; Object.assign(UI.draft, { loc: x.l, lt: x.t, other: false, err: "" }); UI.noFocus = true; return render(); }
      case "other": Object.assign(UI.draft, { other: true, loc: null, err: "" }); UI.focusOther = true; return render();
      case "done": if (!validateDraft()) { UI.noFocus = true; return render(); } UI.view = "summary"; scrollTo(0, 0); return render();
      case "edit": UI.view = "count"; UI.noFocus = true; return render();
      case "confirm": scrollTo(0, 0); return confirmEntry();
      case "tab": UI.tab = b.dataset.tab; UI.page = 1; UI.rcOpen = null; UI.confirmBulk = false; UI.xc = null; return render();
      case "more": UI.page++; return render();
      case "who": UI.who = b.dataset.r; UI.page = 1; UI.rcOpen = null; UI.xc = null; return render();
      case "flt": UI[b.dataset.k] = !UI[b.dataset.k]; UI.page = 1; UI.rcOpen = null; UI.xc = null; return render();
      case "qClear": UI.q = ""; UI.qDraft = ""; UI.page = 1; UI.rcOpen = null; UI.xc = null; return render();
      case "approve": await store.approve([id]); toast("اعتُمدت"); return render();
      case "bulkAsk": UI.confirmBulk = true; return render();
      case "bulkNo": UI.confirmBulk = false; return render();
      case "bulkYes": { const ids = activeParts().filter(p => partStatus(p) === "review" && partTotal(p) === p.q).map(p => p.id); UI.confirmBulk = false; await store.approve(ids); toast(`اعتُمدت ${ids.length} قطعة`); return render(); }
      case "unapprove": await store.unapprove(id); toast("رجعت للمراجعة"); return render();
      case "rcOpen": UI.rcOpen = id; return render();
      case "rcClose": UI.rcOpen = null; return render();
      case "rc": { const p = S.parts.get(id); const places = b.dataset.p.split("").filter(pl => partKeys(p).includes(id + "_" + pl)); UI.rcOpen = null; await store.recount(id, places); toast("رجعت للموظف لإعادة العد"); return render(); }
      case "xlsx": return doExport(b.dataset.k);
      case "xAsk": UI.xc = { id, act: b.dataset.p ? "rc" : "back", places: b.dataset.p }; return render();
      case "xNo": UI.xc = null; return render();
      case "xYes": { const x = UI.xc; UI.xc = null; if (!x) return render(); const p = S.parts.get(x.id);
        const places = x.act === "rc" ? x.places.split("").filter(pl => partKeys(p).includes(x.id + "_" + pl)) : [];
        await store.reopenExported(x.id, places); toast(places.length ? "رجعت للموظف لإعادة العد" : "رجعت للمراجعة"); return render(); }
      case "importNo": UI.importPreview = null; UI.importData = null; return render();
      case "importYes": UI.importBusy = true; render(); await store.importData(UI.importData); UI.importBusy = false; UI.importPreview = null; UI.importData = null; toast("انرفعت البيانات"); return render();
      case "saveDays": { const n = parseInt(document.getElementById("days").value, 10); if (!(n >= 1 && n <= 60)) return toast("اكتب رقم من 1 إلى 60"); await store.setDays(n); return toast("انحفظ"); }
    }
  } catch (e) {
    console.error(e); UI.importBusy = false;
    toast(S.role === "admin" ? "ما تم. تأكد من النت وحاول مرة ثانية." : "Something went wrong. Try again.");
    render();
  }
});
// manager search box: typing only keeps the text; the search runs on Enter / "بحث" (so the phone keyboard isn't interrupted)
app.addEventListener("input", ev => {
  if (ev.target.id !== "mq") return;
  UI.qDraft = ev.target.value;
  if (!UI.qDraft && UI.q) { UI.q = ""; UI.page = 1; render(); }  // cleared with the box's own ✕
});
app.addEventListener("submit", ev => {
  if (ev.target.id !== "mqForm") return;
  ev.preventDefault();
  UI.q = UI.qDraft.trim(); UI.page = 1; UI.rcOpen = null; UI.xc = null;
  if (document.activeElement) document.activeElement.blur();
  render();
});
app.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.matches("#qty,#otherLoc")) { ev.preventDefault(); app.querySelector('[data-act="done"]')?.click(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden && store && store.touch) store.touch(); });

/* ================= boot ================= */
(async () => {
  try { store = DEMO ? demoStore() : await firebaseStore(); store.start(); render(); }
  catch (e) { console.error(e); app.innerHTML = `<div class="wrap"><div class="card"><h2>Can't start</h2><p class="note">Open the app once where there is Wi-Fi, then try again.</p></div></div>`; }
})();
window.__lexus = { S, UI, get store() { return store; }, partStatus, partTotal, exportRows, exportSet, myTasks };
</script>
